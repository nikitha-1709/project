<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><title>Currency Converter</title><body class="nikitha-ui"><h1>Currency Converter</h1><input id="amount" type="number" value="100"><button onclick="convert()">Convert USD to EUR</button><p id="out"></p><script>async function convert(){try{const response=await fetch('https://api.frankfurter.app/latest?from=USD&to=EUR');const data=await response.json();out.textContent=`EUR ${(amount.value*data.rates.EUR).toFixed(2)}`}catch(error){out.textContent='Currency API unavailable'}}</script>
</body>

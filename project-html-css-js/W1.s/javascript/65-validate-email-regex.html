<link rel="stylesheet" href="../nikitha-ui.css"><!doctype html><meta charset="utf-8"><title>65 Validate Email Regex</title><body class="nikitha-ui"><h1>Validate Email with Regex</h1><input id="email" value="student@example.com"><button onclick="output.textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)?'Valid':'Invalid'">Validate</button><p id="output"></p>

<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../nikitha-ui.css">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JavaScript Programs</title>
  <style>
    body{margin:0;background:#f8fafc;color:#172033;font:16px/1.5 Arial,sans-serif}main{width:min(1000px,calc(100% - 2rem));margin:auto;padding:2rem 0}h1{font-size:clamp(2rem,5vw,3.5rem)}section{padding:1.25rem;margin:1rem 0;background:#fff;border:1px solid #dbe3ec;border-radius:8px}button,input,select{padding:.6rem;border:1px solid #94a3b8;border-radius:5px;font:inherit}button{cursor:pointer;background:#c2410c;color:#fff;border-color:#c2410c}output{display:block;margin-top:.75rem;color:#0f766e;font-weight:700}.row{display:flex;flex-wrap:wrap;gap:.5rem}a{color:#c2410c}
  </style>
</head>
<body class="nikitha-ui"><main><p><a href="index.html">Back to JavaScript Lab</a></p><h1>JavaScript programs</h1>
  <section><h2>Hello World and arithmetic</h2><button onclick="hello()">Hello World</button><button onclick="arithmetic()">Calculate 12 and 4</button><output id="hello-output"></output></section>
  <section><h2>Number programs</h2><div class="row"><input id="number" type="number" value="7"><button onclick="numberPrograms()">Run number checks</button></div><output id="number-output"></output></section>
  <section><h2>Array programs</h2><div class="row"><input id="array" value="8, 3, 5, 3, 1"><button onclick="arrayPrograms()">Analyze array</button></div><output id="array-output"></output></section>
  <section><h2>Strings, functions, objects, Date, and Math</h2><button onclick="languagePrograms()">Run demonstrations</button><output id="language-output"></output></section>
  <script>
    const factorial = value => value < 0 ? 'undefined' : Array.from({length:value}, (_, index) => index + 1).reduce((total, item) => total * item, 1);
    const fibonacci = count => { const values=[]; let first=0, second=1; for(let index=0;index<count;index++){values.push(first); [first,second]=[second,first+second];} return values.join(', '); };
    function hello(){document.getElementById('hello-output').textContent='Hello World';}
    function arithmetic(){const a=12,b=4;document.getElementById('hello-output').textContent=`${a}+${b}=${a+b}, ${a}-${b}=${a-b}, ${a}*${b}=${a*b}, ${a}/${b}=${a/b}`;}
    function numberPrograms(){const value=Number(document.getElementById('number').value), digits=Math.abs(value).toString().split('').map(Number); const reversed=Number(digits.reverse().join('')); const prime=value>1&&Array.from({length:Math.floor(Math.sqrt(value))-1},(_,i)=>i+2).every(divisor=>value%divisor); document.getElementById('number-output').textContent=`Largest of 7, 12, ${value}: ${Math.max(7,12,value)} | ${value%2===0?'even':'odd'} | ${value>0?'positive':value<0?'negative':'zero'} | factorial: ${factorial(value)} | Fibonacci: ${fibonacci(8)} | ${prime?'prime':'not prime'} | palindrome: ${String(value)===String(reversed)} | reverse: ${reversed} | digit sum: ${digits.reduce((sum,digit)=>sum+digit,0)}`;}
    function arrayPrograms(){const values=document.getElementById('array').value.split(',').map(Number).filter(Number.isFinite), sorted=[...values].sort((a,b)=>a-b); document.getElementById('array-output').textContent=`Smallest: ${sorted[0]} | largest: ${sorted.at(-1)} | sorted: ${sorted.join(', ')} | sum: ${values.reduce((sum,value)=>sum+value,0)} | average: ${values.reduce((sum,value)=>sum+value,0)/values.length}`;}
    function languagePrograms(){const text='JavaScript lab', person={name:'Student', topic:'objects'}, today=new Date(); document.getElementById('language-output').textContent=`Function: ${factorial(5)} | Arrow function: ${[1,2,3].map(value=>value*2).join(', ')} | String: ${text.toUpperCase()} (${text.includes('Script')}) | Array: ${[1,2,3].map(value=>value*value).join(', ')} | Object: ${person.name} studies ${person.topic} | Date: ${today.toLocaleDateString()} | Math: ${Math.round(Math.PI*100)/100}`;}
  </script>
</main></body></html>

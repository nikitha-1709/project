<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Storage Lab</title><body class="nikitha-ui"><style>body{font:16px Arial;max-width:700px;margin:auto;padding:2rem}.dark{background:#172033;color:white}button{padding:.6rem;margin:.3rem}</style><main><p><a href="index.html">Back</a></p><h1>Browser &amp; Storage APIs</h1><button onclick="windowResult.textContent='Inner width: '+innerWidth">Window object</button><button onclick="navigatorResult.textContent=navigator.userAgent">Navigator object</button><button onclick="locationResult.textContent=location.href">Location object</button><button onclick="historyResult.textContent='History length: '+history.length">History object</button><button onclick="localStorage.setItem('local','Saved');storageResult.textContent=localStorage.getItem('local')">localStorage</button><button onclick="sessionStorage.setItem('session','Saved');storageResult.textContent=sessionStorage.getItem('session')">sessionStorage</button><button onclick="cart.add('Notebook')">Add shopping cart item</button><button onclick="document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light')">Theme switcher</button><p id="windowResult"></p><p id="navigatorResult"></p><p id="locationResult"></p><p id="historyResult"></p><p id="storageResult"></p><p id="cartResult"></p></main><script>const cart={items:JSON.parse(localStorage.getItem('cart')||'[]'),add(item){this.items.push(item);localStorage.setItem('cart',JSON.stringify(this.items));cartResult.textContent='Cart: '+this.items.join(', ')}};if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');</script>
</body>

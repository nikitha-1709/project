<!doctype html><html lang="en"><head><link rel="stylesheet" href="../../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extended DOM Manipulation</title><style>body{font:16px Arial;max-width:1000px;margin:auto;padding:1.5rem;background:#f8fafc}.panel{padding:1rem;margin:1rem 0;background:white;border:1px solid #ddd;border-radius:8px}.active{background:#0f766e;color:white}.tabs button{padding:.6rem}.tab{display:none;padding:1rem;background:#dbeafe}.tab.show{display:block}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:.5rem}input,button,select{padding:.55rem;margin:.2rem}</style></head><body class="nikitha-ui"><p><a href="index.html">Back to DOM Lab</a></p><h1>Extended DOM Manipulation</h1><section class="panel"><h2 id="text">Original text</h2><div id="html">Original HTML</div><button onclick="text.textContent='Text changed'">textContent</button><button onclick="html.innerHTML='<strong>HTML changed with innerHTML</strong>'">innerHTML</button><button onclick="text.style.color='crimson';text.style.background='#fed7aa'">Change style</button><button onclick="document.body.style.background='#dcfce7'">Change background</button><button onclick="createElementDemo()">Create element</button><button onclick="removeElementDemo()">Remove element</button><button onclick="replaceElementDemo()">Replace element</button><button onclick="text.classList.add('active')">Add class</button><button onclick="text.classList.remove('active')">Remove class</button><button onclick="text.classList.toggle('active')">Toggle class</button><button onclick="text.setAttribute('data-status','updated');text.title='Dynamic title'">Change attributes</button><div id="created"></div></section><section class="panel"><h2>Dynamic lists</h2><button onclick="makeUnordered()">Create unordered list</button><input id="orderedInput" placeholder="Add ordered item"><button onclick="addOrdered()">Add ordered item</button><div id="lists"></div></section><section class="panel"><h2>Student table</h2><input id="studentName" placeholder="Student"><input id="studentMark" type="number" placeholder="Mark"><button onclick="addStudent()">Add row</button><input oninput="filterStudents(this.value)" placeholder="Search records"><button onclick="sortStudents()">Sort</button><table><thead><tr><th>Name</th><th>Mark</th><th>Actions</th></tr></thead><tbody id="students"></tbody></table></section><section class="panel"><h2>Menus and images</h2><select id="menu"><option>Choose option</option></select><button onclick="menu.add(new Option('Added option'))">Add select option</button><select id="country" onchange="loadStates()"><option>India</option><option>USA</option></select><select id="state" onchange="loadCities()"></select><select id="city"></select><div id="gallery"></div><button onclick="nextImage()">Next image</button></section><section class="panel"><h2>Visibility, password, tabs, accordion</h2><input id="password" type="password"><button onclick="password.type=password.type==='password'?'text':'password'">Show/hide password</button><button onclick="content.hidden=!content.hidden">Show/hide content</button><p id="content">Toggleable content</p><div class="tabs"><button onclick="openTab('one')">One</button><button onclick="openTab('two')">Two</button></div><div id="one" class="tab show">First tab</div><div id="two" class="tab">Second tab</div><button onclick="accordion.hidden=!accordion.hidden">Accordion</button><p id="accordion">Accordion content</p></section><script>function createElementDemo(){const p=document.createElement('p');p.id='dynamic';p.textContent='New element added dynamically';created.append(p)}function removeElementDemo(){document.getElementById('dynamic')?.remove()}function replaceElementDemo(){const p=document.createElement('p');p.textContent='Replacement element';html.replaceWith(p)}function makeUnordered(){lists.innerHTML='<ul>'+['HTML','CSS','JavaScript'].map(x=>`<li>${x}</li>`).join('')+'</ul>'}function addOrdered(){if(orderedInput.value){let ol=lists.querySelector('ol');if(!ol){ol=document.createElement('ol');lists.append(ol)}ol.insertAdjacentHTML('beforeend',`<li>${orderedInput.value}</li>`);orderedInput.value=''}}function addStudent(){if(studentName.value){students.insertAdjacentHTML('beforeend',`<tr><td>${studentName.value}</td><td>${studentMark.value}</td><td><button onclick="editRow(this)">Edit</button><button onclick="this.closest('tr').remove()">Delete</button></td></tr>`);studentName.value='';studentMark.value=''}}function editRow(button){const row=button.closest('tr');const name=prompt('Student name',row.cells[0].textContent);const mark=prompt('Mark',row.cells[1].textContent);if(name!==null)row.cells[0].textContent=name;if(mark!==null)row.cells[1].textContent=mark}function filterStudents(value){students.querySelectorAll('tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(value.toLowerCase()))}function sortStudents(){[...students.rows].sort((a,b)=>a.cells[0].textContent.localeCompare(b.cells[0].textContent)).forEach(row=>students.append(row))}const locations={India:{Kerala:['Kochi','Kannur'],Karnataka:['Mysuru','Bengaluru']},USA:{Texas:['Dallas','Austin'],Ohio:['Columbus','Toledo']}};function loadStates(){state.innerHTML=Object.keys(locations[country.value]).map(x=>`<option>${x}</option>`).join('');loadCities()}function loadCities(){city.innerHTML=locations[country.value][state.value].map(x=>`<option>${x}</option>`).join('')}loadStates();const images=['https://picsum.photos/id/10/180/100','https://picsum.photos/id/20/180/100','https://picsum.photos/id/30/180/100'];let imageIndex=0;function renderGallery(){gallery.innerHTML=images.map(src=>`<img src="${src}" width="180" alt="Gallery image">`).join('')}function nextImage(){imageIndex=(imageIndex+1)%images.length;gallery.innerHTML=`<img src="${images[imageIndex]}" width="300" alt="Slide">`}renderGallery();function openTab(id){document.querySelectorAll('.tab').forEach(tab=>tab.classList.remove('show'));document.getElementById(id).classList.add('show')}</script></body></html>

<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events Lab</title><body class="nikitha-ui"><style>#drop{padding:2rem;background:#dbeafe}#drop.over{background:#bbf7d0}</style><main><p><a href="index.html">Back</a></p><h1>Events</h1><button onclick="output.textContent='click event'" ondblclick="output.textContent='double-click event'">Click or double-click</button><p id="output"></p><div id="mouse" style="padding:1rem;background:#fed7aa" onmouseover="output.textContent='mouse over'" onmouseout="output.textContent='mouse out'" onmousemove="output.textContent='mouse move'">Mouse events area</div><input onkeydown="key.textContent='Key down: '+event.key" onkeyup="key.textContent='Key up: '+event.key" placeholder="Keyboard events"><p id="key"></p><form onsubmit="event.preventDefault();formResult.textContent='Submitted'" onchange="formResult.textContent='Changed'" onfocusin="formResult.textContent='Focused'" onfocusout="formResult.textContent='Blurred'"><input required placeholder="Form event input"><button>Submit</button></form><p id="formResult"></p><section id="bubble" onclick="event.stopPropagation();output.textContent='inner handler'" style="padding:1rem;background:#e9d5ff"><button>Event bubbling/capturing target</button></section><button onclick="output.textContent='Delegated button: '+event.target.textContent">Event delegation: A</button><button onclick="output.textContent='Delegated button: '+event.target.textContent">Event delegation: B</button><div id="game" tabindex="0" style="margin-top:1rem;padding:2rem;background:#dcfce7" onkeydown="move(event)">Keyboard game: press arrows</div><div id="drop" draggable="true" ondragstart="event.dataTransfer.setData('text','item')" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.textContent='Dropped successfully'">Drag this area</div><p draggable="true" ondragstart="event.dataTransfer.setData('text','item')">Drag this text into the box</p></main><script>function move(e){game.textContent='Key: '+e.key}</script>
</body>

<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOM Manipulation Lab</title><body class="nikitha-ui"><style>.box{padding:1rem;margin:.5rem 0;background:#e0f2fe}.active{background:#0f766e;color:white}table{border-collapse:collapse}td,th{padding:.5rem;border:1px solid #999}</style><main><p><a href="index.html">Back</a></p><h1>DOM Manipulation</h1><button onclick="addElement()">Add element</button><button onclick="removeElement()">Remove element</button><button onclick="changeStyles()">Change CSS</button><button onclick="updateAll()">Update all</button><button onclick="target.classList.toggle('active')">Toggle class</button><div id="target" class="box">Target element</div><h2>Selectors</h2><button onclick="selectElements()">Use ID, class, querySelector, querySelectorAll</button><p class="note">Selector result</p><p id="result"></p><h2>Dynamic table, add/delete/filter rows</h2><input oninput="filterRows(this.value)" placeholder="Filter records"><button onclick="addRow()">Add row</button><table><thead><tr><th>Name</th><th>Action</th></tr></thead><tbody id="records"><tr><td>Nikitha</td><td><button onclick="this.closest('tr').remove()">Delete</button></td></tr><tr><td>Sam</td><td><button onclick="this.closest('tr').remove()">Delete</button></td></tr></tbody></table><h2>Other controls</h2><textarea id="message" maxlength="100" oninput="counter.textContent=this.value.length" placeholder="Live character counter"></textarea><p>Characters: <b id="counter">0</b></p><input id="password" type="password" placeholder="Password"><button onclick="password.type=password.type==='password'?'text':'password'">Show/hide password</button><select id="dropdown"><option>Dynamic dropdown</option></select><button onclick="dropdown.add(new Option('New option'))">Add option</button><select id="country" onchange="states()"><option>India</option><option>USA</option></select><select id="state" onchange="cities()"></select><select id="city"></select><h2>Image carousel</h2><img id="slide" width="280" alt="Carousel image"><button onclick="nextSlide()">Next</button></main><script>function addElement(){const e=document.createElement('p');e.textContent='Added dynamically';e.className='box';target.after(e)}function removeElement(){target.remove()}function changeStyles(){target.style.color='crimson';target.style.fontSize='1.5rem'}function updateAll(){document.querySelectorAll('.note').forEach(e=>e.textContent='Updated simultaneously')}function selectElements(){result.textContent=`ID: ${target.id}; class elements: ${document.getElementsByClassName('note').length}; querySelector: ${document.querySelector('.note').textContent}; all: ${document.querySelectorAll('.note').length}`}function addRow(){records.insertAdjacentHTML('beforeend','<tr><td>New record</td><td><button onclick="this.closest(\'tr\').remove()">Delete</button></td></tr>')}function filterRows(value){records.querySelectorAll('tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(value.toLowerCase()))}const locationData={India:{Kerala:['Kochi','Kannur'],Karnataka:['Mysuru','Bengaluru']},USA:{Texas:['Dallas','Austin'],Ohio:['Columbus','Toledo']}};function states(){state.innerHTML=Object.keys(locationData[country.value]).map(x=>`<option>${x}</option>`).join('');cities()}function cities(){city.innerHTML=locationData[country.value][state.value].map(x=>`<option>${x}</option>`).join('')}states();const slides=['https://picsum.photos/id/10/280/160','https://picsum.photos/id/20/280/160','https://picsum.photos/id/30/280/160'];let slideIndex=0;function nextSlide(){slideIndex=(slideIndex+1)%slides.length;slide.src=slides[slideIndex]}nextSlide()</script>
</body>

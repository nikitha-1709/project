<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><title>Weather API</title><body class="nikitha-ui"><h1>Weather Application</h1><button onclick="loadWeather()">Load sample weather</button><p id="out"></p><script>async function loadWeather(){try{const response=await fetch('https://api.open-meteo.com/v1/forecast?latitude=9.93&longitude=76.27&current=temperature_2m');const data=await response.json();out.textContent=`Temperature: ${data.current.temperature_2m} ${data.current_units.temperature_2m}`}catch(error){out.textContent='Weather service unavailable'}}</script>
</body>

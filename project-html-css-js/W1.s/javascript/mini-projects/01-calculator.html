<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><title>Digital Calculator</title><body class="nikitha-ui"><h1>Digital Calculator</h1><input id="a" type="number" value="8"><select id="op"><option>+</option><option>-</option><option>*</option><option>/</option></select><input id="b" type="number" value="2"><button onclick="calculate()">Calculate</button><p id="out"></p><script>function calculate(){const x=+a.value,y=+b.value;out.textContent=op.value==='+'?x+y:op.value==='-'?x-y:op.value==='*'?x*y:x/y}</script>
</body>

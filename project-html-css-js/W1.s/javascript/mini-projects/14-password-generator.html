<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><title>Password Generator</title><body class="nikitha-ui"><h1>Random Password Generator</h1><button onclick="generate()">Generate</button><input id="out" readonly><script>function generate(){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';out.value=Array.from({length:12},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}</script>
</body>

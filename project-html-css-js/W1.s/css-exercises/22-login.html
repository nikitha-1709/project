<!doctype html><html lang="en"><head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Page</title><link rel="stylesheet" href="styles.css"><style>.login{max-width:400px;margin:10vh auto;background:#fff;padding:2.5rem;border-radius:14px;box-shadow:0 10px 30px #0f17221c}.login h1{color:#0f766e}.login label{display:block;margin-top:1rem;font-weight:bold}.login input{width:100%;box-sizing:border-box;padding:.8rem;margin-top:.4rem;border:1px solid #94a3b8;border-radius:6px}.login input:focus{outline:3px solid #99f6e4;border-color:#0f766e}.login button{width:100%;margin-top:1.5rem;padding:.8rem;background:#0f766e;color:#fff;border:0;border-radius:6px}</style></head><body class="nikitha-ui"><main class="page"><form class="login"><h1>Welcome back</h1><p>Sign in to continue to your dashboard.</p><label for="email">Email</label><input id="email" type="email" required><label for="password">Password</label><input id="password" type="password" required><button type="submit">Sign in</button><p><a href="#reset">Forgot password?</a></p></form></main></body></html>

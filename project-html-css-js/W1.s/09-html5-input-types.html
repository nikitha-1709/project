<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML5 Input Types</title></head>
<body class="nikitha-ui">
  <h1>HTML5 Input Types</h1>
  <form action="#" method="post">
    <p><label for="email">Email: </label><input id="email" type="email" placeholder="student@example.com" required></p>
    <p><label for="date">Date of birth: </label><input id="date" type="date"></p>
    <p><label for="number">Credits: </label><input id="number" type="number" min="1" max="40" value="20"></p>
    <p><label for="password">Password: </label><input id="password" type="password" minlength="8" required></p>
    <button type="submit">Submit</button>
  </form>
</body>
</html>

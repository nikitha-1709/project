<!doctype html><html lang="en"><head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overflow</title><link rel="stylesheet" href="advanced.css"><style>.overflow{height:120px;width:280px;padding:1rem;border:2px solid #0f766e;margin:1rem 0}.auto{overflow:auto}.hidden{overflow:hidden}.scroll{overflow:scroll}</style></head><body class="nikitha-ui"><main><h1>Overflow Properties</h1><div class="overflow auto">Auto overflow adds scrolling only when necessary. This is a deliberately long sentence to demonstrate the behavior.</div><div class="overflow hidden">Hidden overflow clips content that does not fit inside the box.</div><div class="overflow scroll">Scroll overflow always provides scrollbars.</div></main></body></html>

<!doctype html><html lang="en"><head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tooltip</title><link rel="stylesheet" href="advanced.css"><style>.tip{position:relative;display:inline-block;margin:3rem}.tip-text{visibility:hidden;opacity:0;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:.5rem;border-radius:5px;white-space:nowrap;transition:.2s}.tip:hover .tip-text{visibility:visible;opacity:1}</style></head><body class="nikitha-ui"><main><h1>CSS Tooltip</h1><span class="tip"><button aria-label="More information">Hover me</button><span class="tip-text">Helpful information</span></span></main></body></html>

<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><title>Notes App</title><body class="nikitha-ui"><h1>Notes App</h1><textarea id="note" placeholder="Write a note"></textarea><button onclick="save()">Save</button><button onclick="clearNote()">Clear</button><p id="out"></p><script>note.value=localStorage.getItem('note')||'';function save(){localStorage.setItem('note',note.value);out.textContent='Note saved'}function clearNote(){localStorage.removeItem('note');note.value='';out.textContent='Note cleared'}</script>
</body>

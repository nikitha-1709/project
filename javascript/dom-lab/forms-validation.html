<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forms Validation Lab</title><body class="nikitha-ui"><style>form{max-width:520px;display:grid;gap:.7rem}input,textarea,button{padding:.7rem;font:inherit}output{color:#b91c1c}</style><main><p><a href="index.html">Back</a></p><h1>Forms &amp; Validation</h1><form onsubmit="validate(event)"><input id="student" placeholder="Student name"><input id="loginUser" placeholder="Username"><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="Phone"><input id="password" type="password" oninput="strength(this.value)" placeholder="Password"><meter id="meter" min="0" max="4" value="0"></meter><input id="confirm" type="password" placeholder="Confirm password"><select id="course"><option value="">Choose college course</option><option>Computer Science</option><option>Business</option></select><textarea id="feedback" placeholder="Feedback"></textarea><button>Validate form</button></form><output id="result"></output></main><script>function strength(value){meter.value=(value.length>=8)+(/[A-Z]/.test(value))+(/[0-9]/.test(value))+( /[^A-Za-z0-9]/.test(value));}function validate(e){e.preventDefault();const errors=[];if(!student.value.trim())errors.push('Student name');if(!loginUser.value.trim())errors.push('Username');if(!email.validity.valid)errors.push('email');if(!/^\d{10}$/.test(phone.value))errors.push('phone');if(password.value.length<8)errors.push('password strength');if(password.value!==confirm.value)errors.push('password confirmation');if(!course.value)errors.push('course');if(!feedback.value.trim())errors.push('feedback');result.textContent=errors.length?'Fix: '+errors.join(', '):'All form details are valid.'}</script>
</body>

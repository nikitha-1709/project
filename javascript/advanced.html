<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Advanced JavaScript</title><style>body{margin:0;background:#f8fafc;color:#172033;font:16px/1.5 Arial,sans-serif}main{width:min(1000px,calc(100% - 2rem));margin:auto;padding:2rem 0}section{padding:1.2rem;margin:1rem 0;background:#fff;border:1px solid #dbe3ec;border-radius:8px}.tools{display:flex;flex-wrap:wrap;gap:.5rem}button,input{padding:.6rem;border:1px solid #94a3b8;border-radius:5px;font:inherit}button{cursor:pointer;background:#7c3aed;color:#fff;border-color:#7c3aed}output{display:block;margin-top:.7rem;color:#0f766e;font-weight:700;white-space:pre-wrap}a{color:#7c3aed}</style></head>
<body class="nikitha-ui"><main><p><a href="index.html">Back to JavaScript Lab</a></p><h1>Advanced JavaScript lab</h1>
<section><h2>ES6 syntax, classes, inheritance, and operators</h2><button onclick="syntaxDemo()">Run demonstration</button><output id="syntax-output"></output></section>
<section><h2>Callbacks, promises, async/await, and Fetch API</h2><button onclick="asyncDemo()">Run async demonstration</button><output id="async-output"></output></section>
<section><h2>Dynamic API data and localStorage</h2><button onclick="fetchDemo()">Fetch API data</button><button onclick="saveDemo()">Save localStorage value</button><output id="storage-output"></output></section>
<section><h2>Responsive login validation</h2><div class="tools"><input id="login-email" placeholder="Email"><input id="login-password" type="password" placeholder="Password"><button onclick="login()">Log in</button></div><output id="login-output"></output></section>
<script>
function syntaxDemo(){const first='JavaScript', values=[1,2,3], copy=[...values,4], {length}=first; class Person{constructor(name){this.name=name;} greet(){return `Hello ${this.name}`;}} class Student extends Person{study(){return 'studying';}} const student=new Student('Student'); syntaxOutput.textContent=`let/const and template literal: ${first}\nDestructuring length: ${length}\nSpread: ${copy.join(', ')}\nRest: ${((...numbers)=>numbers.reduce((sum,value)=>sum+value,0))(1,2,3)}\nClasses and inheritance: ${student.greet()}, ${student.study()}`;}
function asyncDemo(){const callback=new Promise(resolve=>setTimeout(()=>resolve('Promise resolved'),300)); asyncOutput.textContent='Loading...'; callback.then(message=>{asyncOutput.textContent=`Callback -> ${message}\nasync/await is used by the function that updates this output.`;});}
async function fetchDemo(){storageOutput.textContent='Loading API data...'; try{const response=await fetch('https://jsonplaceholder.typicode.com/todos/1');const data=await response.json();storageOutput.textContent=`API data: ${data.title}`;}catch(error){storageOutput.textContent='Fetch unavailable while offline.';}}
function saveDemo(){localStorage.setItem('javascript-lab','Saved with localStorage');storageOutput.textContent=`Stored value: ${localStorage.getItem('javascript-lab')}`;} function login(){const valid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(loginEmail.value)&&loginPassword.value.length>=8;loginOutput.textContent=valid?'Login details are valid.':'Enter a valid email and a password with at least 8 characters.';}
</script></main></body></html>

<!doctype html><html lang="en"><head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login and Signup</title><link rel="stylesheet" href="advanced.css"><style>.forms{display:grid;grid-template-columns:1fr 1fr;gap:2rem}.form{background:#fff;padding:1.5rem;border-radius:10px}.form label{display:block;margin-top:1rem}.form input{width:100%;padding:.7rem;margin-top:.3rem}@media(max-width:650px){.forms{grid-template-columns:1fr}}</style></head><body class="nikitha-ui"><main><h1>Account Access</h1><div class="forms"><form class="form"><h2>Login</h2><label>Email<input type="email" required></label><label>Password<input type="password" required></label><button>Sign in</button></form><form class="form"><h2>Sign up</h2><label>Name<input required></label><label>Email<input type="email" required></label><label>Password<input type="password" required></label><button>Create account</button></form></div></main></body></html>

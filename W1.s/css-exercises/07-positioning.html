<!doctype html><html lang="en"><head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Positioning</title><link rel="stylesheet" href="styles.css"><style>body{min-height:1200px}.position-stage{position:relative;height:420px;background:#e0f2fe;padding:1rem}.static{background:#fff}.relative{position:relative;left:30px;background:#bbf7d0}.absolute{position:absolute;right:20px;top:80px;background:#fde68a}.sticky{position:sticky;top:0;background:#fca5a5;padding:.5rem}.fixed{position:fixed;right:15px;bottom:15px;background:#1d4ed8;color:#fff;padding:.7rem}</style></head><body class="nikitha-ui"><main class="page"><h1>CSS Positioning</h1><div class="sticky">Sticky element</div><div class="position-stage"><p class="static">Static</p><p class="relative">Relative</p><p class="absolute">Absolute</p></div><div class="fixed">Fixed</div><p>Scroll the page to observe sticky and fixed positioning.</p></main></body></html>

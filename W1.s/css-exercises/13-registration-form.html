<!doctype html><html lang="en"><head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Styled Registration</title><link rel="stylesheet" href="styles.css"><style>form{max-width:520px;background:#fff;padding:2rem;border:1px solid #cbd5e1;border-radius:12px}label{display:block;margin-top:1rem;font-weight:bold}input,select{width:100%;padding:.7rem;margin-top:.35rem;border:1px solid #94a3b8;border-radius:6px;box-sizing:border-box}button{margin-top:1.5rem;background:#0f766e;color:#fff;border:0;padding:.75rem 1.2rem;border-radius:6px;cursor:pointer}button:hover{background:#115e59}</style></head><body class="nikitha-ui"><main class="page"><h1>Registration Form</h1><form><label for="name">Name</label><input id="name" required><label for="email">Email</label><input id="email" type="email" required><label for="course">Course</label><select id="course"><option>Web Development</option><option>UI Design</option></select><button>Register</button></form></main></body></html>

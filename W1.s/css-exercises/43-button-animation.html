<!doctype html><html lang="en"><head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button Animation</title><link rel="stylesheet" href="advanced.css"><style>.animated-button{position:relative;overflow:hidden}.animated-button::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;transform:translateX(-100%);transition:transform .35s,opacity .35s}.animated-button:hover::after{opacity:.2;transform:translateX(0)}</style></head><body class="nikitha-ui"><main><h1>CSS-only Button Hover Animation</h1><button class="animated-button">Explore</button></main></body></html>

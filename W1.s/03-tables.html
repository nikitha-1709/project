<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML Tables</title><style>table{border-collapse:collapse;width:70%;}th,td{border:1px solid #333;padding:10px;text-align:center;}th{background:#dbeafe;}</style></head>
<body class="nikitha-ui">
  <h1>Product Table</h1>
  <table>
    <caption>Quarterly inventory</caption>
    <tr><th colspan="3">Inventory Report</th></tr>
    <tr><th>Product</th><th>Category</th><th>Quantity</th></tr>
    <tr><td>Laptop</td><td>Electronics</td><td>12</td></tr>
    <tr><td rowspan="2">Notebook</td><td>Stationery</td><td>50</td></tr>
    <tr><td colspan="2">Restocking required next month</td></tr>
  </table>
</body>
</html>

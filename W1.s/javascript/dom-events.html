<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DOM &amp; Events</title><style>body{margin:0;background:#f8fafc;color:#172033;font:16px/1.5 Arial,sans-serif}main{width:min(1000px,calc(100% - 2rem));margin:auto;padding:2rem 0}section{padding:1.2rem;margin:1rem 0;background:#fff;border:1px solid #dbe3ec;border-radius:8px}.tools{display:flex;flex-wrap:wrap;gap:.5rem}button,input{padding:.6rem;border:1px solid #94a3b8;border-radius:5px;font:inherit}button{cursor:pointer;background:#0f766e;color:#fff;border-color:#0f766e}#color-box{padding:1rem;margin-top:1rem;background:#dbeafe}output{display:block;margin-top:.7rem;color:#0f766e;font-weight:700}a{color:#0f766e}ul{padding-left:1.2rem}</style></head>
<body class="nikitha-ui"><main><p><a href="index.html">Back to JavaScript Lab</a></p><h1>DOM &amp; event experiments</h1>
<section><h2 id="message">Original text</h2><div class="tools"><button onclick="changeText()">Change text</button><button onclick="toggleBox()">Show / hide</button><button onclick="changeColor()">Change background</button></div><div id="color-box">This element is controlled by JavaScript.</div></section>
<section><h2>Calculator</h2><div class="tools"><input id="first" type="number" value="8"><select id="operator"><option>+</option><option>-</option><option>*</option><option>/</option></select><input id="second" type="number" value="2"><button onclick="calculate()">Calculate</button></div><output id="calc-output"></output></section>
<section><h2>Clock, stopwatch, and countdown</h2><div class="tools"><button onclick="startStopwatch()">Start stopwatch</button><button onclick="stopwatchTime=0;showTime()">Reset</button><button onclick="startCountdown()">Start 10-second countdown</button></div><output id="time-output"></output></section>
<section><h2>Guessing game and counter</h2><div class="tools"><input id="guess" type="number" placeholder="1 to 10"><button onclick="guessNumber()">Guess</button><button onclick="count(-1)">-</button><strong id="counter">0</strong><button onclick="count(1)">+</button></div><output id="game-output"></output></section>
<section><h2>To-do list and form validation</h2><div class="tools"><input id="todo" placeholder="New task"><button onclick="addTodo()">Add task</button></div><ul id="todo-list"></ul><div class="tools"><input id="email" placeholder="email@example.com"><input id="password" type="password" placeholder="Password"><button onclick="validateForm()">Validate</button></div><output id="form-output"></output></section>
<section><h2>Quiz</h2><p>Which keyword declares a constant?</p><div class="tools"><button onclick="quiz('var')">var</button><button onclick="quiz('const')">const</button><button onclick="quiz('let')">let</button></div><output id="quiz-output"></output></section>
<script>
let hidden=false, counterValue=0, stopwatchTime=0, stopwatchId, countdownId; const secret=Math.floor(Math.random()*10)+1;
function changeText(){document.getElementById('message').textContent='Text changed with JavaScript';} function toggleBox(){hidden=!hidden;document.getElementById('color-box').hidden=hidden;} function changeColor(){document.getElementById('color-box').style.background='#fed7aa';}
function calculate(){const a=Number(first.value),b=Number(second.value),op=operator.value;calcOutput.textContent=`Result: ${op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:a/b}`;} function showTime(){document.getElementById('time-output').textContent=`Stopwatch: ${stopwatchTime}s`;} function startStopwatch(){clearInterval(stopwatchId);stopwatchId=setInterval(()=>{stopwatchTime++;showTime();},1000);} function startCountdown(){let value=10;clearInterval(countdownId);timeOutput.textContent=`Countdown: ${value}`;countdownId=setInterval(()=>{value--;timeOutput.textContent=`Countdown: ${value}`;if(value===0)clearInterval(countdownId);},1000);}
function guessNumber(){const value=Number(guess.value);gameOutput.textContent=value===secret?'Correct!':value<secret?'Try higher.':'Try lower.';} function count(amount){counterValue+=amount;counter.textContent=counterValue;} function addTodo(){if(todo.value.trim()){const item=document.createElement('li');item.textContent=todo.value;todoList.append(item);todo.value='';}} function validateForm(){formOutput.textContent=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)&&password.value.length>=8?'Valid email and password.':'Enter a valid email and an 8-character password.';} function quiz(answer){quizOutput.textContent=answer==='const'?'Correct!':'Try again.';}
</script></main></body></html>

<link rel="stylesheet" href="../../nikitha-ui.css"><!doctype html><meta charset="utf-8"><title>Expense Tracker</title><body class="nikitha-ui"><h1>Expense Tracker</h1><input id="name" placeholder="Expense"><input id="amount" type="number" placeholder="Amount"><button onclick="add()">Add</button><ul id="list"></ul><p id="total">Total: 0</p><script>let total=0;function add(){const value=+amount.value;if(name.value&&value){total+=value;const item=document.createElement('li');item.textContent=`${name.value}: ${value}`;list.append(item);document.getElementById('total').textContent=`Total: ${total}`;name.value='';amount.value=''}}</script>
</body>

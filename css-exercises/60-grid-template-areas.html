<!doctype html><html lang="en"><head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid Template Areas</title><link rel="stylesheet" href="advanced.css"><style>.layout{display:grid;grid-template-areas:'head head' 'nav main' 'foot foot';grid-template-columns:180px 1fr;gap:1rem}.head{grid-area:head;background:#0f766e;color:#fff;padding:1rem}.nav{grid-area:nav;background:#dbeafe;padding:1rem}.main{grid-area:main;padding:1rem;background:#fff}.foot{grid-area:foot;background:#0f172a;color:#fff;padding:1rem}@media(max-width:600px){.layout{grid-template-areas:'head' 'nav' 'main' 'foot';grid-template-columns:1fr}}</style></head><body class="nikitha-ui"><div class="layout"><header class="head">Header</header><nav class="nav">Navigation</nav><main class="main"><h1>Template Areas</h1><p>Named regions make layouts easy to read.</p></main><footer class="foot">Footer</footer></div></body></html>

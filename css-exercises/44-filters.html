<!doctype html><html lang="en"><head><link rel="stylesheet" href="../nikitha-ui.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS Filters</title><link rel="stylesheet" href="advanced.css"><style>.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.filters img{width:100%;height:150px;object-fit:cover}.blur{filter:blur(3px)}.gray{filter:grayscale(1)}.bright{filter:brightness(1.6)}.contrast{filter:contrast(1.8)}@media(max-width:700px){.filters{grid-template-columns:repeat(2,1fr)}}</style></head><body class="nikitha-ui"><main><h1>CSS Filters</h1><div class="filters"><img src="https://picsum.photos/id/80/400/300" alt="Blur example" class="blur"><img src="https://picsum.photos/id/81/400/300" alt="Grayscale example" class="gray"><img src="https://picsum.photos/id/82/400/300" alt="Brightness example" class="bright"><img src="https://picsum.photos/id/83/400/300" alt="Contrast example" class="contrast"></div></main></body></html>
